<script>
// 数据由生成脚本注入
const ATTESTATIONS = window.__ATTESTATIONS || [];
const META = window.__META || {};

document.getElementById('totalCount').textContent = ATTESTATIONS.length;
document.getElementById('statCount').textContent = ATTESTATIONS.length;

let total = 0;
ATTESTATIONS.forEach(a => { total += parseFloat(a.amount) || 0; });
document.getElementById('statTotal').textContent = total.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');

document.getElementById('statContract').textContent = META.contract || '—';
document.getElementById('statSender').textContent = META.sender || '—';
document.getElementById('genTime').textContent = new Date().toLocaleString('zh-CN');

function shortHash(h, head=10, tail=8) {
  if (!h) return '';
  if (h.length <= head + tail + 3) return h;
  return h.slice(0, head) + '...' + h.slice(-tail);
}

function renderList(list) {
  const container = document.getElementById('txList');
  if (!list.length) {
    container.innerHTML = '<div class="empty">无匹配记录</div>';
    return;
  }
  container.innerHTML = list.map(a => {
    const tsDate = a.ts ? new Date(a.ts).toLocaleString('zh-CN') : '—';
    return `
      <div class="tx-card">
        <div class="tx-head">
          <div class="tx-name">${escapeHtml(a.name)}</div>
          <div class="tx-receipt">${escapeHtml(a.receipt)}</div>
        </div>
        <div class="tx-row">
          <div class="tx-label">存证金额</div>
          <div class="tx-value amount">${a.amount} USDT</div>
        </div>
        <div class="tx-row">
          <div class="tx-label">受益人地址</div>
          <div class="tx-value">${escapeHtml(a.addr)}</div>
        </div>
        <div class="tx-row">
          <div class="tx-label">交易哈希 (txID)</div>
          <div class="tx-value hash" title="${escapeHtml(a.txid)}">${shortHash(a.txid, 16, 12)}</div>
        </div>
        <div class="tx-row">
          <div class="tx-label">上链时间</div>
          <div class="tx-value">${tsDate}</div>
        </div>
      </div>
    `;
  }).join('');
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

const searchInput = document.getElementById('searchInput');
searchInput.addEventListener('input', () => {
  const q = searchInput.value.trim().toLowerCase();
  if (!q) { renderList(ATTESTATIONS); return; }
  const filtered = ATTESTATIONS.filter(a =>
    (a.name || '').toLowerCase().includes(q) ||
    (a.receipt || '').toLowerCase().includes(q) ||
    (a.txid || '').toLowerCase().includes(q) ||
    (a.addr || '').toLowerCase().includes(q)
  );
  renderList(filtered);
});

renderList(ATTESTATIONS);
</script>
