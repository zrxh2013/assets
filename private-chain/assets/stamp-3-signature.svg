<svg width="320" height="160" viewBox="0 0 320 160" xmlns="http://www.w3.org/2000/svg">
  <title>邓达明 公证员签名章（教学演示模板）</title>
  <desc>规格 4.5cm × 2.5cm · 蓝色印泥 · 无边框 · 楷体手写</desc>

  <!-- 背景（演示用白色，实际盖在文书上直接用蓝色印泥） -->
  <rect x="0" y="0" width="320" height="160" fill="#fff" />

  <!-- 蓝色印泥效果 -->
  <rect x="20" y="20" width="280" height="120" fill="#1a5276" opacity="0.06" rx="4" />

  <!-- 标题说明 -->
  <text x="160" y="16" text-anchor="middle" fill="#888" font-size="10" font-family="SimSun">
    公证员签名章 · 规格 4.5×2.5cm · 蓝色 · 无边框
  </text>

  <!-- 主签名：楷体手写风 -->
  <text x="160" y="75" text-anchor="middle" fill="#1a5276" font-size="48"
        font-family="KaiTi, STKaiti, 楷体, 华文楷体" font-weight="bold"
        style="letter-spacing: 12px;">邓 达 明</text>

  <!-- 英文签名 -->
  <text x="160" y="105" text-anchor="middle" fill="#1a5276" font-size="14"
        font-family="Segoe Script, cursive" font-style="italic">Raymond Tang</text>

  <!-- 下划线 -->
  <line x1="60" y1="118" x2="260" y2="118" stroke="#1a5276" stroke-width="1" />

  <!-- 底部小字 -->
  <text x="160" y="138" text-anchor="middle" fill="#1a5276" font-size="11"
        font-family="SimSun">中国委托公证人（香港） · 公证员签名章</text>

  <!-- 水印 -->
  <text x="160" y="156" text-anchor="middle" fill="#ccc" font-size="9" font-family="SimSun">
    ⚠ 教学演示模板 · 非真实印章
  </text>
</svg>
