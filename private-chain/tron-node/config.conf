net {
  type = mainnet
  # p2p version
  p2p {
    version = 11111
  }
}

node {
  # trust node, it is not needed.
  trustNode = ""
  # ip list for seed node, split by ",", e.g. ip1:port1,ip2:port2
  seedNode {
    ip.list = []
  }

  listen.port = 18888
  listen.ip = "127.0.0.1"

  # 固定外部 IP，避免访问外部 IP 服务导致卡
  external.ip = "127.0.0.1"

  # http api
  http {
    fullNodePort = 18090
    solidityPort = 18091
    historyHttpPort = 18092
    # choose whether to open the http api service
    fullNodeAllowOrigin = "*"
    solidityAllowOrigin = "*"
    https = {
      enable = false
      ssl {
        sslKey = ""
        sslCert = ""
        sslKeyCertChain = ""
      }
    }
    # open history data query service for fullnode
    enableHistoryQueryWhenLiteFallback = false
  }

  # rpc config
  rpc {
    # min effective connection for broadcasting transactions
    # set to 0 for single-node private chain
    minEffectiveConnection = 0
    trxCacheEnable = true
  }
}

block = {
  # 1500ms
  maintenanceTimeInterval = 1500
  # 3000ms
  proposeTimeInterval = 3000
  # maxTimeSyncDiff
  maxTimeSyncDiff = 100
  # Time ratio to refresh block, 80%
  blockProducedTimeOut = 1500
  # sync block time
  syncBlockTimeout = 3000
  # 私链首个 SR 节点关闭同步检查
  needSyncCheck = false
}

