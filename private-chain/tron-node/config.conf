# 交易执行配置
vm = {
  supportConstant = false
  minTimeRatio = 0.0
  maxTimeRatio = 5.0
  longRunningTimeRatio = 10.0
  maxEnergyLimitForConstant = 50000000
}

# 委员会参数
committee = {
  # 1 TRX
  creationFee = 1000000
  # 0.002 TRX
  transactionFee = 2
  # 1 TRX
  updateAccountPermissionFee = 1000000
  # 0.1 TRX
  updateAccountNameFee = 100000
  # 100 TRX
  accountUpgradeCost = 100000000
}

# 存储配置
storage = {
  # 数据库目录
  db.version = 2,
  db.engine = "LEVELDB"
  db.sync = false
  db.directory = "database",
  db.index.switch = "on",
  index.switch = "on"
  index.directory = "index"
  # 快照间隔
  snapshot.interval = 60000
  # 是否使用 rocksdb
  useRocksDb = false
}

# 事件插件配置
event.subscribe = {
  native = {
    useNativeQueue = true
    bindport = 0
    sendqueuelength = 1000
  }
  path = ""
  server = ""
  dbconfig = ""
  topics = []
  filter = {
    fromblock = "0"
    toblock = "0"
    contractAddress = []
    contractTopic = []
  }
}

# API 配置
api = {
  # 最大连接数
  maxHttpConnectNumber = 50
  # 最大交易信息列表
  maxTransactionListSize = 50
  # 禁止的 API
  forbidTransferToContract = false
  # 每次获取的最大资源
  maxGetHeaderNumber = 10000
}

# 交易池配置
pendingCheck = {
  # 是否检查 pending 交易
  checkPending = true
  # pending 交易过期时间 (ms)
  pendingExpirationTime = 60000
  # 检查间隔 (ms)
  checkInterval = 5000
}

# 交易过期时间 (ms)
transactionExpirationTime = 60000

# 允许的合约类型
contractSwitch = {
  allowSameTokenName = 1
  allowTvmSolidity059 = 1
  allowTvmConstantinople = 1
  allowTvmSolidity060 = 1
  allowTvmIstanbul = 1
