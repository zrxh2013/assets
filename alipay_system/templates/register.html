{% extends "base.html" %}
{% block title %}商户注册 - 支付宝收款码系统{% endblock %}
{% block body %}
<div class="auth-wrap">
  <div class="auth-card">
    <div class="logo">¥</div>
    <h1>商户注册</h1>
    <p class="sub">创建您的收款码商户账号</p>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="post" action="{{ url_for('register') }}">
      <div class="form-group">
        <label>用户名</label>
        <input class="form-control" type="text" name="username" required autofocus
               value="{{ request.form.username }}" placeholder="用作登录">
      </div>
      <div class="form-group">
        <label>密码（至少 6 位）</label>
        <input class="form-control" type="password" name="password" required placeholder="设置登录密码">
      </div>
      <div class="form-group">
        <label>商户名称</label>
        <input class="form-control" type="text" name="merchant_name" required
               value="{{ request.form.merchant_name }}" placeholder="展示给买家看的店名">
      </div>
      <div class="form-group">
        <label>支付宝账号</label>
        <input class="form-control" type="text" name="alipay_account" required
               value="{{ request.form.alipay_account }}" placeholder="邮箱或手机号">
      </div>
      <div class="form-group">
        <label>真实姓名（实名认证，选填）</label>
        <input class="form-control" type="text" name="real_name"
               value="{{ request.form.real_name }}" placeholder="如 王小明">
      </div>
      <div class="form-group">
        <label>身份证号（选填，18 位）</label>
        <input class="form-control" type="text" name="id_card" maxlength="18"
               value="{{ request.form.id_card }}" placeholder="如 110101199001010012">
      </div>
      <button class="btn btn-primary btn-block" type="submit">注 册</button>
    </form>
    <div class="switch">已有账号？ <a href="{{ url_for('login') }}">去登录</a></div>
  </div>
</div>
{% endblock %}
