{% extends "base.html" %}
{% block title %}登录 - 支付宝收款码系统{% endblock %}
{% block body %}
<div class="auth-wrap">
  <div class="auth-card">
    <div class="logo">¥</div>
    <h1>支付宝收款码系统</h1>
    <p class="sub">商户登录后台</p>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="post" action="{{ url_for('login') }}">
      <div class="form-group">
        <label>用户名</label>
        <input class="form-control" type="text" name="username" required autofocus
               value="{{ request.form.username }}" placeholder="请输入用户名">
      </div>
      <div class="form-group">
        <label>密码</label>
        <input class="form-control" type="password" name="password" required placeholder="请输入密码">
      </div>
      <button class="btn btn-primary btn-block" type="submit">登 录</button>
    </form>
    <div class="switch">还没有账号？ <a href="{{ url_for('register') }}">立即注册</a></div>
  </div>
</div>
{% endblock %}
